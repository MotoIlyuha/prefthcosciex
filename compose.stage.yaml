# Stage overlay: real TLS on 80/443 via Caddy, plus the nightly backup sidecar.
# Usage: docker compose -f compose.yaml -f compose.stage.yaml up -d --build
services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${STAGE_SITE_ADDRESS}

  api:
    environment:
      BAYT_ENV: stage

  backup:
    build:
      context: ./infra
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    volumes:
      - backups:/backups

volumes:
  backups:
