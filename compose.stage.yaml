# Stage overlay: real TLS on 80/443 via Caddy, plus the nightly backup sidecar.
# Usage: docker compose -f compose.yaml -f compose.stage.yaml up -d --build
services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${STAGE_SITE_ADDRESS}

  api:
    environment:
      BAYT_ENV: stage

  backup:
    build:
      context: ./infra
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # rclone remote "s3" without a config file; also serves `docker compose exec backup rclone ...`
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ENDPOINT: ${S3_ENDPOINT}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    volumes:
      - backups:/backups

volumes:
  backups:
