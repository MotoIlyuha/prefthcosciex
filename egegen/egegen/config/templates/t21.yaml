# Задание 21 — теория игр. Общий движок с заданиями 19-21;
# различается только спрашиваемый предикат (W1/L1/W2/L2).
task_no: 21
title: "Игра: дерево игры"

subtypes:
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g1_add_double":
    title: "Одна куча, ходы +1 и ×2"
    difficulty: [1, 4]
    target_seconds: 300
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g2_add_k_times_k":
    title: "Одна куча, ходы +k и ×k"
    difficulty: [2, 5]
    target_seconds: 330
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g3_two_piles":
    title: "Две кучи, окончание по сумме"
    difficulty: [3, 5]
    target_seconds: 400
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g5_three_moves":
    title: "Три возможных хода"
    difficulty: [3, 5]
    target_seconds: 380
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g6_decreasing":
    title: "Убывающая игра: камни убирают"
    difficulty: [2, 5]
    target_seconds: 350

templates:
  - id: t21_g1_add_double
    subtype: "g1_add_double"
    text: |
      Петя и Ваня играют в следующую игру. {start} Игроки ходят
      по очереди, первый ход делает Петя. За один ход игрок может:
      {moves}.

      {ending}

      Известно, что у Вани есть выигрышная стратегия, позволяющая ему
      выиграть **первым или вторым** ходом при любой игре Пети, но при
      этом у Вани **нет** стратегии, гарантирующей победу первым ходом.

      Найдите **минимальное** значение S, при котором это возможно.
      В ответе запишите целое число.

  - id: t21_g2_add_k_times_k
    subtype: "g2_add_k_times_k"
    text: |
      Петя и Ваня играют в следующую игру. {start} Игроки ходят
      по очереди, первый ход делает Петя. За один ход игрок может:
      {moves}.

      {ending}

      Петя ходит первым, Ваня — вторым. При выбранном S Ваня гарантированно
      выигрывает первым или вторым ходом, однако выиграть **именно первым**
      ходом при любой игре Пети он не может.

      Укажите **наименьшее** такое значение S. В ответе запишите целое число.

