# Задание 3 — поиск в реляционной базе данных.
task_no: 3
title: "Поиск в реляционной базе данных (связанные таблицы)"

subtypes:
  # плейсхолдеры: {department} {district} {operation} {date_from} {date_to} {rows} {preview}
  "3.1_sum_quantity":
    title: "Суммарное количество по отделу и району"
    difficulty: [1, 3]
    target_seconds: 180
  "3.2_packs":
    title: "В упаковках, а не в штуках"
    difficulty: [2, 4]
    target_seconds: 200
  "3.3_revenue":
    title: "Стоимость (цена за упаковку)"
    difficulty: [3, 5]
    target_seconds: 220
  "3.4_difference":
    title: "Разность поступления и продажи"
    difficulty: [3, 5]
    target_seconds: 220
  "3.5_change":
    title: "На сколько изменилось количество"
    difficulty: [4, 5]
    target_seconds: 230

templates:
  - id: t3_sum
    subtype: "3.1_sum_quantity"
    text: |
      В файлах `3-movement.csv`, `3-products.csv` и `3-shops.csv`
      (и в файле `3.ods` — те же три таблицы на трёх листах) приведена
      информация о торговой сети: движение товаров, справочник товаров
      и справочник магазинов. Таблица движения содержит {rows} записей.

      Начало таблицы движения товаров:

      {preview}

      Определите общее **количество штук** товаров отдела
      «{department}», по которым в магазинах района «{district}»
      прошла операция «{operation}» в период с {date_from}
      по {date_to} включительно.

      В ответе запишите целое число.

  - id: t3_packs
    subtype: "3.2_packs"
    text: |
      В файлах `3-movement.csv`, `3-products.csv` и `3-shops.csv`
      приведена информация о торговой сети. В таблице движения
      количество указано **в штуках**, а в справочнике товаров есть
      столбец «В упаковке» — сколько штук содержится в одной упаковке.

      Начало таблицы движения товаров:

      {preview}

      Определите, сколько **упаковок** товаров отдела «{department}»
      прошло операцию «{operation}» в магазинах района «{district}»
      в период с {date_from} по {date_to} включительно.

      В ответе запишите целое число.

  - id: t3_revenue
    subtype: "3.3_revenue"
    text: |
      В файлах `3-movement.csv`, `3-products.csv` и `3-shops.csv`
      приведена информация о торговой сети. Цена в справочнике товаров
      указана **за одну упаковку**, а количество в таблице движения —
      **в штуках**.

      Начало таблицы движения товаров:

      {preview}

      Определите суммарную стоимость товаров отдела «{department}»,
      по которым прошла операция «{operation}» в магазинах района
      «{district}» с {date_from} по {date_to} включительно.

      В ответе запишите целое число.

  - id: t3_difference
    subtype: "3.4_difference"
    text: |
      В файлах `3-movement.csv`, `3-products.csv` и `3-shops.csv`
      приведена информация о торговой сети. Операции бывают двух видов:
      «Поступление» и «Продажа».

      Начало таблицы движения товаров:

      {preview}

      Определите, на сколько штук поступление товаров отдела
      «{department}» в магазинах района «{district}» превысило их
      продажу за период с {date_from} по {date_to} включительно.
      Если продажа оказалась больше, запишите разность по модулю.

      В ответе запишите целое число.

  - id: t3_change
    subtype: "3.5_change"
    text: |
      В файлах `3-movement.csv`, `3-products.csv` и `3-shops.csv`
      приведена информация о торговой сети: движение товаров, товары
      и магазины.

      Начало таблицы движения товаров:

      {preview}

      Определите, на сколько штук изменилось количество товаров отдела
      «{department}» в магазинах района «{district}» за период
      с {date_from} по {date_to} включительно. Изменение — это
      поступления минус продажи; ответ запишите по модулю.

      В ответе запишите целое число.
