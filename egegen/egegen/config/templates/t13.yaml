# Задание 13 — анализ хода исполнения алгоритма (бывшее задание 23).
# Набор команд берётся из egegen/config/fipi_2027.yaml (t13.commands).
task_no: 13
title: "Анализ хода исполнения алгоритма (число программ)"

subtypes:
  # плейсхолдеры: {a} {b} {commands}
  "13.1_direct":
    title: "Сколько программ переводят A в B"
    difficulty: [1, 3]
    target_seconds: 420
  # дополнительно: {c}
  "13.2_through":
    title: "Через промежуточное число"
    difficulty: [2, 4]
    target_seconds: 440
  # дополнительно: {c}
  "13.3_avoiding":
    title: "Минуя промежуточное число"
    difficulty: [3, 5]
    target_seconds: 460
  # дополнительно: {c} {d}
  "13.4_through_not_through":
    title: "Через одно число, но не через другое"
    difficulty: [4, 5]
    target_seconds: 480
  # дополнительно: {lo} {hi} {max_len}
  "13.5_non_monotone":
    title: "С командой уменьшения и ограничениями"
    difficulty: [4, 5]
    target_seconds: 500
  # дополнительно: {c}
  "13.6_trajectory":
    title: "Траектория содержит заданное число"
    difficulty: [2, 4]
    target_seconds: 440

templates:
  - id: t13_direct
    subtype: "13.1_direct"
    text: |
      Исполнитель преобразует число на экране. У исполнителя есть две команды,
      которым присвоены номера:

      {commands}

      Программа для исполнителя — это последовательность команд.

      Сколько существует программ, которые число **{a}** преобразуют
      в число **{b}**? В ответе запишите целое число.

  - id: t13_direct_alt
    subtype: "13.1_direct"
    text: |
      На экране исполнителя записано число. Исполнитель умеет выполнять
      команды:

      {commands}

      Программа — непустая или пустая последовательность таких команд.

      Определите количество программ, переводящих число **{a}**
      в число **{b}**. В ответе запишите целое число.

  - id: t13_through
    subtype: "13.2_through"
    text: |
      Исполнитель преобразует число на экране. Команды исполнителя:

      {commands}

      Сколько существует программ, которые число **{a}** преобразуют
      в число **{b}**, причём **траектория вычислений содержит число
      {c}**? Траектория — это последовательность результатов после каждой
      команды.

      В ответе запишите целое число.

  - id: t13_avoiding
    subtype: "13.3_avoiding"
    text: |
      Исполнитель преобразует число на экране. Команды исполнителя:

      {commands}

      Сколько существует программ, которые число **{a}** преобразуют
      в число **{b}**, причём траектория вычислений **не содержит**
      число **{c}**?

      В ответе запишите целое число.

  - id: t13_through_not
    subtype: "13.4_through_not_through"
    text: |
      Исполнитель преобразует число на экране. Команды исполнителя:

      {commands}

      Сколько существует программ, которые число **{a}** преобразуют
      в число **{b}**, причём траектория вычислений **содержит** число
      **{c}** и **не содержит** число **{d}**?

      В ответе запишите целое число.

  - id: t13_bounded
    subtype: "13.5_non_monotone"
    text: |
      Исполнитель преобразует число на экране. Команды исполнителя:

      {commands}

      Все промежуточные значения должны оставаться в пределах
      от **{lo}** до **{hi}** включительно, а длина программы
      не превышает **{max_len}** команд.

      Сколько существует программ, которые число **{a}** преобразуют
      в число **{b}**? В ответе запишите целое число.

  - id: t13_trajectory
    subtype: "13.6_trajectory"
    text: |
      Исполнитель преобразует число на экране. Команды исполнителя:

      {commands}

      Траекторией вычислений называется последовательность результатов,
      получающихся после выполнения каждой команды.

      Сколько существует программ, переводящих **{a}** в **{b}**,
      у которых траектория вычислений содержит число **{c}**?
      В ответе запишите целое число.
