# Задание 12 — исполнитель Редактор.
task_no: 12
title: "Исполнитель Редактор (замены в строке)"

subtypes:
  # плейсхолдеры: {start} {rules} {condition} {question} {symbol} {target_metric}
  "12.1_digit_sum":
    title: "Сумма цифр итоговой строки"
    difficulty: [1, 4]
    target_seconds: 360
  "12.2_length_count":
    title: "Длина строки или количество символа"
    difficulty: [1, 4]
    target_seconds: 340
  "12.3_three_rules":
    title: "Три символа и три правила"
    difficulty: [3, 5]
    target_seconds: 400
  "12.4_reverse":
    title: "Обратная задача: найти исходную длину"
    difficulty: [3, 5]
    target_seconds: 420
  "12.5_long_string":
    title: "Длинная строка — ищем закономерность"
    difficulty: [4, 5]
    target_seconds: 420

templates:
  - id: t12_sum
    subtype: "12.1_digit_sum"
    text: |
      Исполнитель Редактор получает на вход строку цифр и преобразует её.
      Команда `заменить (v, w)` находит в строке **первое слева**
      вхождение подстроки v и заменяет его на w; если вхождений нет,
      строка не меняется.

      Дана программа:

      ```
      НАЧАЛО
        ПОКА {condition}
      {rules}
        КОНЕЦ ПОКА
      КОНЕЦ
      ```

      На вход подана строка: **{start}**

      Определите {question}. В ответе запишите целое число.

  - id: t12_length
    subtype: "12.2_length_count"
    text: |
      Исполнитель Редактор получает на вход строку цифр. Команда
      `заменить (v, w)` заменяет **первое слева** вхождение подстроки v
      на подстроку w.

      Программа:

      ```
      НАЧАЛО
        ПОКА {condition}
      {rules}
        КОНЕЦ ПОКА
      КОНЕЦ
      ```

      Исходная строка: **{start}**

      Определите {question}. В ответе запишите целое число.

  - id: t12_three
    subtype: "12.3_three_rules"
    text: |
      Исполнитель Редактор обрабатывает строку цифр. Команда
      `заменить (v, w)` заменяет только **первое слева** вхождение v.
      Команды `ЕСЛИ` выполняются **последовательно**, одна за другой.

      ```
      НАЧАЛО
        ПОКА {condition}
      {rules}
        КОНЕЦ ПОКА
      КОНЕЦ
      ```

      Исходная строка: **{start}**

      Определите {question}. В ответе запишите целое число.

  - id: t12_reverse
    subtype: "12.4_reverse"
    text: |
      Исполнитель Редактор получает на вход строку вида
      «N одинаковых цифр, затем ещё N одинаковых цифр другого вида»
      (например, при N = 3 это было бы 111222 для цифр 1 и 2).
      Команда `заменить (v, w)` заменяет **первое слева** вхождение v.

      ```
      НАЧАЛО
        ПОКА {condition}
      {rules}
        КОНЕЦ ПОКА
      КОНЕЦ
      ```

      Здесь первый блок состоит из цифр, а второй — из других цифр;
      их вид виден из правил программы. После работы программы длина
      строки оказалась равна **{target_metric}**.

      Найдите N. В ответе запишите целое число.

  - id: t12_long
    subtype: "12.5_long_string"
    text: |
      Исполнитель Редактор обрабатывает длинную строку цифр. Команда
      `заменить (v, w)` заменяет **первое слева** вхождение подстроки v.

      ```
      НАЧАЛО
        ПОКА {condition}
      {rules}
        КОНЕЦ ПОКА
      КОНЕЦ
      ```

      Исходная строка: **{start}**

      Определите {question}. Если моделировать долго — запустите программу
      для малых длин блоков, найдите закономерность и продолжите её.
      В ответе запишите целое число.
