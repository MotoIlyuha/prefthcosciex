# Задание 8 — комбинаторика: подсчёт слов, кодов и чисел.
task_no: 8
title: "Комбинаторика: подсчёт слов и кодов"

subtypes:
  # плейсхолдеры: {alphabet} {alphabet_plain} {length} {conditions} {count}
  "8.1_constraints":
    title: "Количество слов с ограничениями"
    difficulty: [1, 5]
    target_seconds: 240
  # дополнительно: {word}
  "8.2_word_number":
    title: "Номер слова в упорядоченном списке"
    difficulty: [2, 4]
    target_seconds: 260
  "8.3_distinct_letters":
    title: "Слова из различных букв"
    difficulty: [1, 4]
    target_seconds: 200
  "8.4_digits_base":
    title: "Числа в системе счисления с условиями на цифры"
    difficulty: [2, 5]
    target_seconds: 260
  "8.5_large":
    title: "Большой объём — считаем формулой"
    difficulty: [3, 5]
    target_seconds: 280

templates:
  - id: t8_words
    subtype: "8.1_constraints"
    text: |
      Все четырёхбуквенные и более длинные слова составляются из букв
      {alphabet}. Рассматриваются слова длины {length}, в которых
      выполняются условия: {conditions}.

      Сколько существует таких слов? В ответе запишите целое число.

  - id: t8_words_codes
    subtype: "8.1_constraints"
    text: |
      Вася составляет коды из {count} букв {alphabet}. Длина кода —
      {length} букв. Код считается допустимым, если {conditions}.

      Сколько допустимых кодов может составить Вася?
      В ответе запишите целое число.

  - id: t8_number
    subtype: "8.2_word_number"
    text: |
      Все слова длины {length}, составленные из букв {alphabet},
      выписаны в алфавитном порядке. Буквы упорядочены именно так, как
      перечислено выше (а не по обычному русскому алфавиту).

      Начало списка выглядит так: 1‑е слово состоит из первых букв,
      затем меняется последняя буква, и так далее.

      Определите номер слова **{word}** в этом списке.
      В ответе запишите целое число.

  - id: t8_distinct
    subtype: "8.3_distinct_letters"
    text: |
      Из букв {alphabet} составляются слова длины {length}, причём
      {conditions}.

      Сколько существует таких слов? В ответе запишите целое число.

  - id: t8_digits
    subtype: "8.4_digits_base"
    text: |
      Рассматриваются последовательности из {length} цифр, каждая из
      которых принимает значения {alphabet}. Последовательность
      считается допустимой, если {conditions}.

      Сколько существует допустимых последовательностей?
      В ответе запишите целое число.

  - id: t8_large
    subtype: "8.5_large"
    text: |
      Из букв {alphabet} составляются слова длины {length}, причём
      {conditions}.

      Сколько существует таких слов? Полный перебор здесь уже слишком
      долог — воспользуйтесь правилом умножения.
      В ответе запишите целое число.
