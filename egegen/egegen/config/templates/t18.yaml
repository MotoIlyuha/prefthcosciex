# Задание 18 — робот-сборщик в электронной таблице.
task_no: 18
title: "Электронные таблицы: Робот‑сборщик (макс./мин. путь)"

subtypes:
  # плейсхолдеры: {size} {start} {finish} {moves} {walls_note}
  "18.1_no_walls":
    title: "Без стен, вправо и вниз"
    difficulty: [1, 3]
    target_seconds: 480
  "18.2_walls":
    title: "Со стенами"
    difficulty: [2, 5]
    target_seconds: 520
  "18.3_up_right":
    title: "Старт в левом нижнем углу, вверх и вправо"
    difficulty: [3, 5]
    target_seconds: 540
  "18.4_dense_walls":
    title: "Плотные стены"
    difficulty: [4, 5]
    target_seconds: 560
  "18.5_large":
    title: "Большое поле"
    difficulty: [3, 5]
    target_seconds: 540

templates:
  - id: t18_plain
    subtype: "18.1_no_walls"
    text: |
      Квадратное поле размером {size} × {size} клеток разлиновано
      на клетки, в каждой из которых лежит несколько монет. Числа
      в клетках — количество монет.

      Робот начинает движение в {start} клетке поля и должен попасть
      в {finish}. За один ход робот перемещается в соседнюю клетку
      {moves}. Монеты из клетки, в которой робот побывал (включая
      стартовую), он забирает.

      Определите **максимальную** и **минимальную** суммы монет,
      которые может собрать робот.

      В ответе запишите два числа через пробел: сначала максимальную
      сумму, затем минимальную.

  - id: t18_walls
    subtype: "18.2_walls"
    text: |
      Квадратное поле {size} × {size} клеток; в каждой клетке лежит
      несколько монет (числа в клетках).

      Робот стартует в {start} клетке и должен попасть в {finish},
      перемещаясь за один ход {moves}. Монеты из посещённых клеток
      (включая стартовую) он забирает.

      {walls_note}

      Определите максимальную и минимальную суммы монет, которые
      может собрать робот. В ответе запишите два числа через пробел:
      сначала максимальную, затем минимальную.

  - id: t18_up_right
    subtype: "18.3_up_right"
    text: |
      Квадратное поле {size} × {size} клеток; числа в клетках —
      количество монет.

      Робот начинает в {start} клетке и должен попасть в {finish}.
      За один ход он перемещается {moves}. Монеты из всех посещённых
      клеток, включая стартовую, робот забирает.

      {walls_note}

      Определите максимальную и минимальную суммы монет.
      В ответе запишите два числа через пробел: максимальную, затем
      минимальную.

  - id: t18_dense
    subtype: "18.4_dense_walls"
    text: |
      Квадратное поле {size} × {size} клеток. Числа — монеты в клетках.
      Робот идёт из {start} клетки в {finish}, за один ход перемещаясь
      {moves}.

      {walls_note}
      Стен здесь много, поэтому не все маршруты возможны.

      Определите максимальную и минимальную суммы собранных монет.
      В ответе запишите два числа через пробел.

  - id: t18_large
    subtype: "18.5_large"
    text: |
      Поле размером {size} × {size} клеток; в каждой клетке записано
      количество монет. Робот перемещается из {start} клетки в {finish},
      за один ход — {moves}, и забирает монеты из всех клеток,
      где побывал.

      {walls_note}

      Определите максимальную и минимальную суммы монет.
      В ответе запишите два числа через пробел: сначала максимальную.
