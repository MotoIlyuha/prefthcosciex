    difficulty: [2, 5]
    target_seconds: 350

templates:
  - id: t19_g1_add_double
    subtype: "g1_add_double"
    text: |
      Петя и Ваня играют в следующую игру. {start} Игроки ходят
      по очереди, первый ход делает Петя. За один ход игрок может:
      {moves}.

      {ending}

      Известно, что Петя не может выиграть за один ход при любой игре
      Вани, но при любом ходе Пети Ваня выигрывает своим первым ходом.

      Найдите **минимальное** значение S, при котором это возможно.
      В ответе запишите целое число.

  - id: t19_g2_add_k_times_k
    subtype: "g2_add_k_times_k"
    text: |
      Петя и Ваня играют в следующую игру. {start} Игроки ходят
      по очереди, первый ход делает Петя. За один ход игрок может:
      {moves}.

      {ending}

      Петя ходит первым, Ваня — вторым. Известно, что при выбранном S
      Петя не выигрывает за один ход, а Ваня выигрывает своим первым
      ходом **при любом** ходе Пети.

      Укажите **наименьшее** такое значение S. В ответе запишите целое число.

