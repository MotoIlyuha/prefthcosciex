# Задание 19 — теория игр. Общий движок с заданиями 19-21;
# различается только спрашиваемый предикат (W1/L1/W2/L2).
task_no: 19
title: "Игра: анализ алгоритма"

subtypes:
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g1_add_double":
    title: "Одна куча, ходы +1 и ×2"
    difficulty: [1, 4]
    target_seconds: 300
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g2_add_k_times_k":
    title: "Одна куча, ходы +k и ×k"
    difficulty: [2, 5]
    target_seconds: 330
  # плейсхолдеры: {start} {moves} {ending} {target}
  "g3_two_piles":
    title: "Две кучи, окончание по сумме"
    difficulty: [3, 5]
    target_seconds: 400
  # плейсхолдеры: {start} {moves} {ending} {target}
