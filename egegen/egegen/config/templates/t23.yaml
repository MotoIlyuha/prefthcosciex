# Задание 23 — графы: оптимальный путь и число путей (новое в 2027).
# Формат входных данных задаётся egegen/config/fipi_2027.yaml
# (t23.graph_input_format) и подставляется через {presentation}.
task_no: 23
title: "Графы: оптимальный путь и число путей"

subtypes:
  # плейсхолдеры: {size} {source} {target} {presentation}
  "23.1_shortest_path":
    title: "Длина кратчайшего пути"
    difficulty: [1, 5]
    target_seconds: 720
  "23.2_dag_paths":
    title: "Число путей в ациклическом графе"
    difficulty: [1, 4]
    target_seconds: 700
  # дополнительно: {via} {condition}
  "23.3_paths_through":
    title: "Число путей через вершину или минуя её"
    difficulty: [3, 5]
    target_seconds: 760
  # дополнительно: {via}
  "23.4_shortest_via":
    title: "Кратчайший путь через заданную вершину"
    difficulty: [3, 5]
    target_seconds: 760
  "23.5_count_shortest":
    title: "Количество кратчайших путей"
    difficulty: [4, 5]
    target_seconds: 780
  "23.6_longest_dag":
    title: "Длиннейший путь в ациклическом графе"
    difficulty: [2, 5]
    target_seconds: 720

templates:
  - id: t23_shortest
    subtype: "23.1_shortest_path"
    text: |
      Дан неориентированный взвешенный граф из {size} вершин.
      {presentation}

      Определите **длину кратчайшего пути** из вершины **{source}**
      в вершину **{target}**. Длина пути — это сумма весов рёбер,
      а не количество рёбер.

      В ответе запишите целое число.

  - id: t23_shortest_route
    subtype: "23.1_shortest_path"
    text: |
      Между населёнными пунктами проложены дороги; их длины заданы
      весами рёбер графа из {size} вершин.
      {presentation}

      Найдите длину кратчайшего маршрута из пункта **{source}**
      в пункт **{target}**.

      В ответе запишите целое число.

  - id: t23_dag_paths
    subtype: "23.2_dag_paths"
    text: |
      Дан ориентированный ациклический граф из {size} вершин.
      {presentation}

      Сколько существует различных путей из вершины **{source}**
      в вершину **{target}**? Путь может проходить через любые вершины,
      двигаться можно только по направлению дуг.

      В ответе запишите целое число.

  - id: t23_through
    subtype: "23.3_paths_through"
    text: |
      Дан ориентированный ациклический граф из {size} вершин.
      {presentation}

      Сколько существует различных путей из вершины **{source}**
      в вершину **{target}**, {condition}?

      Двигаться можно только по направлению дуг.
      В ответе запишите целое число.

  - id: t23_via
    subtype: "23.4_shortest_via"
    text: |
      Дан неориентированный взвешенный граф из {size} вершин.
      {presentation}

      Определите длину кратчайшего пути из вершины **{source}**
      в вершину **{target}**, который **обязательно проходит через
      вершину {via}**.

      В ответе запишите целое число.

  - id: t23_count_shortest
    subtype: "23.5_count_shortest"
    text: |
      Дан неориентированный взвешенный граф из {size} вершин.
      {presentation}

      Сколько существует различных **кратчайших** путей из вершины
      **{source}** в вершину **{target}**? Два пути считаются разными,
      если они отличаются хотя бы одной вершиной.

      В ответе запишите целое число.

  - id: t23_longest
    subtype: "23.6_longest_dag"
    text: |
      Дан ориентированный ациклический граф из {size} вершин.
      {presentation}

      Определите **наибольшее количество дуг** в пути из вершины
      **{source}** в вершину **{target}**.

      В ответе запишите целое число.
