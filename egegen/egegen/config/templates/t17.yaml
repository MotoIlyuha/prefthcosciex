# Задание 17 — обработка числовой последовательности из файла.
task_no: 17
title: "Программа обработки числовой последовательности (файл)"

subtypes:
  # плейсхолдеры: {size} {condition} {preview} {span} {gap}
  "17.1_divisible_pair":
    title: "Пары соседей: делимость обоих"
    difficulty: [1, 3]
    target_seconds: 780
  "17.2_exactly_one":
    title: "Ровно одно / хотя бы одно из чисел"
    difficulty: [2, 5]
    target_seconds: 800
  "17.3_global_value":
    title: "Условие через вспомогательную величину"
    difficulty: [3, 5]
    target_seconds: 840
  "17.4_triples":
    title: "Тройки подряд идущих чисел"
    difficulty: [3, 5]
    target_seconds: 820
  "17.5_distance_k":
    title: "Элементы на расстоянии k"
    difficulty: [3, 5]
    target_seconds: 820

templates:
  - id: t17_pairs
    subtype: "17.1_divisible_pair"
    text: |
      В файле `17.txt` содержится последовательность целых чисел
      ({size} строк, по одному числу в строке). Числа не превышают
      10 000 по модулю и могут быть отрицательными.

      Начало файла:

      ```
      {preview}
      …
      ```

      Рассматриваются **пары соседних** элементов последовательности,
      для которых {condition}.

      Определите количество таких пар и максимальную сумму элементов
      среди них. В ответе запишите **два числа через пробел**: сначала
      количество пар, затем максимальную сумму.

  - id: t17_pairs_sum
    subtype: "17.2_exactly_one"
    text: |
      В файле `17.txt` записана последовательность из {size} целых чисел,
      каждое в отдельной строке; числа не превышают 10 000 по модулю.

      Начало файла:

      ```
      {preview}
      …
      ```

      Найдите пары **соседних** элементов, для которых {condition}.

      В ответе запишите два числа через пробел: количество найденных пар
      и максимальную сумму элементов такой пары.

  - id: t17_global
    subtype: "17.3_global_value"
    text: |
      В файле `17.txt` записана последовательность из {size} целых чисел
      (по одному в строке), не превышающих 10 000 по модулю.

      Начало файла:

      ```
      {preview}
      …
      ```

      Рассматриваются пары соседних элементов, для которых {condition}.

      Определите количество таких пар и максимальную сумму элементов
      среди них. В ответе запишите два числа через пробел: сначала
      количество, затем максимальную сумму.

  - id: t17_triples
    subtype: "17.4_triples"
    text: |
      В файле `17.txt` записана последовательность из {size} целых чисел,
      по одному в строке.

      Начало файла:

      ```
      {preview}
      …
      ```

      Рассматриваются **тройки подряд идущих** элементов, для которых
      {condition}.

      Определите количество таких троек и максимальную сумму их элементов.
      В ответе запишите два числа через пробел: сначала количество,
      затем максимальную сумму.

  - id: t17_distance
    subtype: "17.5_distance_k"
    text: |
      В файле `17.txt` записана последовательность из {size} целых чисел,
      по одному в строке.

      Начало файла:

      ```
      {preview}
      …
      ```

      Рассматриваются пары элементов, стоящих на расстоянии **{gap}**
      друг от друга (то есть элементы с индексами i и i + {gap}),
      для которых {condition}.

      Определите количество таких пар и максимальную сумму их элементов.
      В ответе запишите два числа через пробел.
