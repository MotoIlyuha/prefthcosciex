# Задание 7 — объём графики и звука.
task_no: 7
title: "Объём графики и звука"

subtypes:
  # плейсхолдеры: {width} {height} {colours} {unit}
  "7.1_image_volume":
    title: "Объём растрового изображения"
    difficulty: [1, 4]
    target_seconds: 300
  # плейсхолдеры: {scale} {old_colours} {new_colours}
  "7.2_ratio":
    title: "Во сколько раз изменился объём"
    difficulty: [2, 5]
    target_seconds: 330
  # плейсхолдеры: {freq} {depth} {minutes} {channels} {unit}
  "7.3_sound":
    title: "Объём звукового файла"
    difficulty: [1, 5]
    target_seconds: 300
  # плейсхолдеры: {size} {size_unit} {speed} {speed_unit}
  "7.4_transfer":
    title: "Время передачи по каналу"
    difficulty: [1, 4]
    target_seconds: 270
  # плейсхолдеры: {width} {height} {budget} {unit}
  "7.5_palette":
    title: "Максимальное число цветов при ограничении объёма"
    difficulty: [3, 5]
    target_seconds: 330

templates:
  - id: t7_image_scan
    subtype: "7.1_image_volume"
    text: |
      Рисунок размером {width} × {height} пикселей сохранён в виде несжатого
      растрового изображения. При кодировании используется палитра из
      {colours} цветов, каждый пиксель кодируется минимально возможным
      целым числом бит.

      Определите объём файла с изображением. В ответе запишите целое число —
      размер в {unit}.

  - id: t7_image_camera
    subtype: "7.1_image_volume"
    text: |
      Камера видеонаблюдения делает кадры размером {width} × {height} пикселей.
      Кадр хранится без сжатия; в палитре {colours} цветов, на каждый пиксель
      отводится минимально возможное целое число бит.

      Сколько {unit} занимает один кадр? В ответе запишите целое число.

  - id: t7_ratio
    subtype: "7.2_ratio"
    text: |
      Изображение было пересохранено: каждая сторона увеличилась
      в {scale} раза, а палитра изменилась с {old_colours} цветов
      на {new_colours}. Сжатие не используется, на пиксель отводится
      минимально возможное целое число бит.

      Во сколько раз увеличился объём файла? В ответе запишите целое число.

  - id: t7_sound
    subtype: "7.3_sound"
    text: |
      Звук записан с частотой дискретизации {freq} кГц и глубиной
      кодирования {depth} бит, запись {channels}, длительность
      {minutes} мин. Сжатие данных не производится.

      Определите объём записи. В ответе запишите целое число — размер
      в {unit}.

  - id: t7_sound_lecture
    subtype: "7.3_sound"
    text: |
      Для архива лекций звук оцифровывают с частотой {freq} кГц,
      глубина кодирования {depth} бит, режим — {channels}.
      Одна лекция длится {minutes} мин, сжатие не применяется.

      Сколько {unit} займёт одна лекция? В ответе запишите целое число.

  - id: t7_transfer
    subtype: "7.4_transfer"
    text: |
      Файл размером {size} {size_unit} передаётся по каналу связи
      со скоростью {speed} {speed_unit}.

      Сколько секунд займёт передача? В ответе запишите целое число.

  - id: t7_palette
    subtype: "7.5_palette"
    text: |
      Для хранения растрового изображения размером {width} × {height}
      пикселей отвели {budget} {unit} памяти. Изображение хранится без
      сжатия, все пиксели кодируются одинаковым числом бит.

      Какое максимальное количество цветов может содержать палитра?
      В ответе запишите целое число — количество цветов.
