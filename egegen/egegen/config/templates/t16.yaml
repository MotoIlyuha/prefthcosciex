# Задание 16 — рекуррентные выражения.
task_no: 16
title: "Рекуррентные выражения (рекурсия)"

subtypes:
  # плейсхолдеры: {definition} {code} {n} {n2}
  "16.1_value":
    title: "Значение F(n) при большом n"
    difficulty: [1, 4]
    target_seconds: 300
  "16.2_difference":
    title: "Разность значений"
    difficulty: [2, 5]
    target_seconds: 320
  "16.3_parity_branch":
    title: "Ветвление по чётности"
    difficulty: [2, 5]
    target_seconds: 320
  "16.4_call_count":
    title: "Количество вызовов функции"
    difficulty: [3, 5]
    target_seconds: 360
  "16.5_two_args":
    title: "Функция двух аргументов"
    difficulty: [3, 5]
    target_seconds: 340

templates:
  - id: t16_value
    subtype: "16.1_value"
    text: |
      Алгоритм вычисления значения функции F(n), где n — натуральное
      число, задан следующими соотношениями:

      {definition}

      Чему равно значение **F({n})**? В ответе запишите целое число.

  - id: t16_value_alt
    subtype: "16.1_value"
    text: |
      Функция F(n) определена для натуральных n так:

      {definition}

      Вычислите **F({n})** и запишите полученное целое число в ответе.

  - id: t16_difference
    subtype: "16.2_difference"
    text: |
      Алгоритм вычисления значения функции F(n) задан соотношениями:

      {definition}

      Чему равно значение выражения **F({n}) − F({n2})**?
      В ответе запишите целое число.

  - id: t16_parity
    subtype: "16.3_parity_branch"
    text: |
      Функция F(n) задана следующими соотношениями:

      {definition}

      Обратите внимание: ветвь выбирается по чётности **самого n**,
      а не по чётности предыдущего значения.

      Чему равно значение **F({n})**? В ответе запишите целое число.

  - id: t16_calls
    subtype: "16.4_call_count"
    text: |
      Функция F(n) задана соотношениями:

      {definition}

      Сколько всего вызовов функции F произойдёт при вычислении
      **F({n})**, если считать и сам первый вызов, и все вложенные,
      и **не использовать** запоминание уже вычисленных значений?
      В ответе запишите целое число.

  - id: t16_two_args
    subtype: "16.5_two_args"
    text: |
      Функция F(a, b) задана соотношениями:

      {definition}

      Чему равно значение **F({n}, {n2})**? В ответе запишите целое
      число.
