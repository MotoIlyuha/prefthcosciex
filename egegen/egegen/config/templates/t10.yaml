# Задание 10 — маска подсети (новое место в 2027).
# Формат ответа задаётся egegen/config/fipi_2027.yaml (t10.answer_transform),
# поэтому в шаблонах используется плейсхолдер {answer_hint}.
task_no: 10
title: "Маска подсети"

subtypes:
  # плейсхолдеры: {ip1} {ip2} {answer_hint} {prefix} {mask}
  "10.1_same_network":
    title: "Два адреса в одной сети: наименьшая сеть"
    difficulty: [2, 5]
    target_seconds: 180
  # дополнительно: {mask}
  "10.2_network_address":
    title: "Адрес и маска → адрес сети"
    difficulty: [1, 3]
    target_seconds: 150
  # дополнительно: {network} {ones}
  "10.3_count_addresses":
    title: "Сколько адресов сети удовлетворяют условию"
    difficulty: [3, 5]
    target_seconds: 220
  # дополнительно: {network}
  "10.4_find_mask":
    title: "По адресу узла и адресу сети найти маску"
    difficulty: [2, 4]
    target_seconds: 180
  # дополнительно: {byte_index}
  "10.5_mask_byte":
    title: "Байт маски"
    difficulty: [3, 5]
    target_seconds: 200

templates:
  - id: t10_same_network
    subtype: "10.1_same_network"
    text: |
      В терминологии сетей TCP/IP маской сети называется двоичное число,
      определяющее, какая часть IP‑адреса узла относится к адресу сети.
      Адрес сети получается применением поразрядной конъюнкции к адресу
      узла и маске. Маска всегда состоит из подряд идущих единиц,
      за которыми идут нули.

      Узлы с адресами **{ip1}** и **{ip2}** находятся в одной сети,
      причём эта сеть содержит **наименьшее возможное** число адресов.

      Найдите адрес этой сети. В ответе запишите {answer_hint}.

  - id: t10_same_network_office
    subtype: "10.1_same_network"
    text: |
      Два компьютера офиса имеют адреса **{ip1}** и **{ip2}**.
      Известно, что они находятся в одной подсети, и администратор
      выбрал маску так, чтобы подсеть была **как можно меньше**
      (то есть число единиц в маске — наибольшее возможное).

      Определите адрес подсети. В ответе запишите {answer_hint}.

  - id: t10_network_address
    subtype: "10.2_network_address"
    text: |
      Узел имеет IP‑адрес **{ip1}**, маска подсети — **{mask}**.
      Адрес сети получается поразрядной конъюнкцией адреса узла и маски.

      Определите адрес сети. В ответе запишите {answer_hint}.

  - id: t10_count
    subtype: "10.3_count_addresses"
    text: |
      Для сети с адресом **{network}** используется маска, содержащая
      **{prefix}** единиц.

      Сколько адресов этой сети (включая адрес сети и широковещательный)
      содержат в своей двоичной записи — по всем 32 битам — ровно
      **{ones}** единиц? В ответе запишите целое число.

  - id: t10_find_mask
    subtype: "10.4_find_mask"
    text: |
      Узел с адресом **{ip1}** принадлежит сети с адресом **{network}**.
      Маска состоит из подряд идущих единиц, за которыми идут нули.

      Определите наибольшее возможное количество единиц в маске.
      В ответе запишите целое число.

  - id: t10_mask_byte
    subtype: "10.5_mask_byte"
    text: |
      Узлы с адресами **{ip1}** и **{ip2}** находятся в одной сети,
      содержащей наименьшее возможное число адресов.

      Чему равен **{byte_index} слева** байт маски этой сети?
      В ответе запишите число от 0 до 255.
