# Задание 4 — кодирование, условие Фано.
task_no: 4
title: "Кодирование, условие Фано"

subtypes:
  # плейсхолдеры: {table} {letter}
  "4.1_shortest_code":
    title: "Кратчайшее кодовое слово для новой буквы"
    difficulty: [1, 4]
    target_seconds: 120
  # плейсхолдеры: {table} {letter}
  "4.2_reverse_fano":
    title: "Обратное условие Фано (по окончаниям)"
    difficulty: [3, 5]
    target_seconds: 160
  # плейсхолдеры: {table} {extra} {extra_letters}
  "4.3_min_total_length":
    title: "Минимальная суммарная длина кодов"
    difficulty: [3, 5]
    target_seconds: 180
  # плейсхолдеры: {table} {encoded}
  "4.4_decode":
    title: "Декодирование сообщения"
    difficulty: [1, 3]
    target_seconds: 140
  # плейсхолдеры: {table} {k}
  "4.5_count_words":
    title: "Сколько слов длины k можно добавить"
    difficulty: [2, 5]
    target_seconds: 150

templates:
  - id: t4_shortest_plain
    subtype: "4.1_shortest_code"
    text: |
      Для кодирования букв использованы двоичные кодовые слова:

      {table}

      Нужно закодировать ещё одну букву — **{letter}** — так, чтобы код
      по-прежнему удовлетворял **условию Фано**: ни одно кодовое слово
      не является началом другого.

      Укажите кратчайшее возможное кодовое слово для буквы {letter};
      если таких слов несколько, выберите то, у которого **наименьшее
      числовое значение**. Ведущие нули значимы.

  - id: t4_shortest_telemetry
    subtype: "4.1_shortest_code"
    text: |
      Телеметрия станции передаётся двоичным префиксным кодом. Сигналам уже
      сопоставлены кодовые слова:

      {table}

      Добавляется новый сигнал **{letter}**. Подберите для него кратчайшее
      кодовое слово, при котором код остаётся однозначно декодируемым
      (условие Фано); среди слов минимальной длины возьмите наименьшее
      по числовому значению.

  - id: t4_reverse
    subtype: "4.2_reverse_fano"
    text: |
      Для кодирования букв использованы двоичные кодовые слова:

      {table}

      Код должен удовлетворять **обратному условию Фано**: ни одно кодовое
      слово не является **окончанием** другого. Требуется добавить букву
      **{letter}**.

      Укажите кратчайшее подходящее кодовое слово; среди слов минимальной
      длины выберите наименьшее по числовому значению.

  - id: t4_min_total
    subtype: "4.3_min_total_length"
    text: |
      Для части букв уже выбраны двоичные кодовые слова:

      {table}

      Осталось закодировать ещё {extra} буквы ({extra_letters}) так, чтобы
      код удовлетворял условию Фано, а **суммарная длина** новых кодовых
      слов была наименьшей.

      Укажите эту наименьшую суммарную длину — целое число.

  - id: t4_decode
    subtype: "4.4_decode"
    text: |
      Для кодирования букв использованы двоичные кодовые слова:

      {table}

      Код удовлетворяет условию Фано, поэтому сообщение декодируется
      однозначно. Декодируйте сообщение:

      `{encoded}`

      В ответе запишите полученное слово (последовательность букв без
      пробелов).

  - id: t4_count
    subtype: "4.5_count_words"
    text: |
      Для кодирования букв использованы двоичные кодовые слова:

      {table}

      Сколько различных кодовых слов **длины {k}** можно добавить к этому
      набору так, чтобы код по-прежнему удовлетворял условию Фано?
      Каждое слово рассматривается отдельно от остальных кандидатов.
      В ответе запишите целое число.
