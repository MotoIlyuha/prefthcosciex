# Задание 15 — математическая логика с параметром.
task_no: 15
title: "Математическая логика (отрезки, ДЕЛ, множества, побитовые)"

subtypes:
  # плейсхолдеры: {p1} {p2} {q1} {q2}
  "15.1_segments":
    title: "Отрезки на числовой прямой"
    difficulty: [1, 5]
    target_seconds: 180
  # плейсхолдеры: {a} {b}
  "15.2_del":
    title: "Делимость ДЕЛ(x, A)"
    difficulty: [1, 4]
    target_seconds: 180
  # плейсхолдеры: {universe} {p} {q} {r}
  "15.3_sets":
    title: "Множества"
    difficulty: [2, 5]
    target_seconds: 200
  # плейсхолдеры: {a} {b}
  "15.4_bitwise":
    title: "Побитовые операции"
    difficulty: [3, 5]
    target_seconds: 210

templates:
  - id: t15_segments
    subtype: "15.1_segments"
    text: |
      На числовой прямой даны два отрезка: P = [{p1}; {p2}]
      и Q = [{q1}; {q2}].

      Укажите **наименьшую возможную длину** отрезка A, при котором
      формула

      **((x ∈ P) ∧ ¬(x ∈ Q)) → (x ∈ A)**

      тождественно истинна, то есть принимает значение 1 при любом
      действительном значении переменной x.

      В ответе запишите целое число — длину отрезка.

  - id: t15_segments_alt
    subtype: "15.1_segments"
    text: |
      На числовой прямой заданы отрезки P = [{p1}; {p2}]
      и Q = [{q1}; {q2}].

      Найдите наименьшую возможную длину отрезка A, при которой формула

      **((x ∈ P) ∧ ¬(x ∈ Q)) → (x ∈ A)**

      истинна при **любом** действительном x.

      В ответе запишите целое число.

  - id: t15_del
    subtype: "15.2_del"
    text: |
      Обозначим через ДЕЛ(n, m) утверждение «натуральное число n делится
      без остатка на натуральное число m».

      Для какого **наибольшего** натурального числа A формула

      **¬ДЕЛ(x, {a}) ∨ ¬ДЕЛ(x, {b}) ∨ ДЕЛ(x, A)**

      тождественно истинна, то есть принимает значение 1 при любом
      натуральном значении переменной x?

      В ответе запишите целое число.

  - id: t15_sets
    subtype: "15.3_sets"
    text: |
      Рассматриваются множества натуральных чисел, все элементы которых
      берутся из набора U = {{{universe}}}. Даны множества:

      - P = {{{p}}}
      - Q = {{{q}}}
      - R = {{{r}}}

      Найдите множество A, при котором формула

      **((x ∈ P) ∧ (x ∈ Q) → (x ∈ A)) ∧ ((x ∈ A) → (x ∈ R))**

      тождественно истинна при любом x из U, а **сумма элементов A**
      минимальна.

      В ответе запишите эту минимальную сумму — целое число.

  - id: t15_bitwise
    subtype: "15.4_bitwise"
    text: |
      Обозначим через m & n поразрядную конъюнкцию неотрицательных
      целых чисел m и n.

      Определите **наименьшее** натуральное число A, при котором формула

      **(x & {a} = 0) ∨ (x & {b} = 0) ∨ (x & A ≠ 0)**

      тождественно истинна, то есть принимает значение 1 при любом
      неотрицательном целом значении переменной x.

      В ответе запишите целое число.
