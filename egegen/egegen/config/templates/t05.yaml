# Задание 5 — формальное исполнение алгоритма над записью числа.
task_no: 5
title: "Формальное исполнение алгоритма (двоичные преобразования)"

subtypes:
  # плейсхолдеры: {steps} {threshold} {base} {example}
  "5.1_min_greater":
    title: "Наименьшее N, при котором R больше порога"
    difficulty: [1, 4]
    target_seconds: 240
  "5.2_max_less":
    title: "Наибольшее N, при котором R меньше порога"
    difficulty: [2, 5]
    target_seconds: 260
  # дополнительно: {target}
  "5.3_by_result":
    title: "Найти N по заданному R"
    difficulty: [2, 4]
    target_seconds: 250
  # дополнительно: {options}
  "5.4_unreachable":
    title: "Какое число не может быть результатом"
    difficulty: [3, 5]
    target_seconds: 300
  # дополнительно: {digit_sum}
  "5.5_digit_sum":
    title: "Сумма цифр результата"
    difficulty: [3, 5]
    target_seconds: 280
  "5.6_ternary":
    title: "Троичная система счисления"
    difficulty: [3, 5]
    target_seconds: 300

templates:
  - id: t5_min
    subtype: "5.1_min_greater"
    text: |
      Автомат получает на вход натуральное число N и строит по нему новое
      число R следующим образом.

      {steps}

      {example}

      Укажите **наименьшее** число N, для которого результат работы
      алгоритма **больше {threshold}**. В ответе запишите это число
      в десятичной системе счисления.

  - id: t5_min_device
    subtype: "5.1_min_greater"
    text: |
      Исполнитель обрабатывает натуральное число N по такому алгоритму:

      {steps}

      {example}

      Найдите **минимальное** N, при котором R **превышает {threshold}**.
      Ответ запишите десятичным числом.

  - id: t5_max
    subtype: "5.2_max_less"
    text: |
      Автомат получает на вход натуральное число N и строит по нему
      число R:

      {steps}

      {example}

      Укажите **наибольшее** число N, для которого результат работы
      алгоритма **меньше {threshold}**. Ответ запишите в десятичной
      системе счисления.

  - id: t5_by_result
    subtype: "5.3_by_result"
    text: |
      Автомат получает на вход натуральное число N и строит по нему
      число R:

      {steps}

      {example}

      Известно, что R = {target}, и такое N единственно.
      Найдите N. Ответ запишите десятичным числом.

  - id: t5_unreachable
    subtype: "5.4_unreachable"
    text: |
      Автомат получает на вход натуральное число N и строит по нему
      число R:

      {steps}

      {example}

      Какое из чисел **{options}** не может быть результатом работы
      автомата? Перебирайте варианты ответа, а не значения N.
      В ответе запишите это число.

  - id: t5_digit_sum
    subtype: "5.5_digit_sum"
    text: |
      Автомат получает на вход натуральное число N и строит по нему
      число R:

      {steps}

      {example}

      Укажите **наименьшее** N, для которого сумма цифр числа R
      в системе счисления с основанием {base} равна **{digit_sum}**.
      Ответ запишите десятичным числом.

  - id: t5_ternary
    subtype: "5.6_ternary"
    text: |
      Автомат получает на вход натуральное число N и работает
      с его **троичной** записью:

      {steps}

      {example}

      Укажите **наименьшее** число N, для которого результат работы
      алгоритма **больше {threshold}**. Ответ запишите в десятичной
      системе счисления.
