# Задание 27 — анализ данных: два файла, эффективный алгоритм.
# Формат ответа задаётся egegen/config/fipi_2027.yaml (t27.answer_layout);
# в шаблонах он подставляется через {layout_hint}.
task_no: 27
title: "Анализ данных: два файла, эффективный алгоритм"

subtypes:
  # плейсхолдеры: {a_size} {b_size} {mini_size} {k} {m} {window} {preview} {layout_hint}
  "27.1_pair_distance_mod":
    title: "Пара на расстоянии ≥ K с суммой, кратной M"
    difficulty: [1, 5]
    target_seconds: 2160
  "27.2_pair_one_divisible":
    title: "Пара, где хотя бы одно число кратно M"
    difficulty: [2, 5]
    target_seconds: 2160
  "27.3_count_pairs":
    title: "Количество подходящих пар"
    difficulty: [2, 5]
    target_seconds: 2100
  "27.4_window_sum":
    title: "Окно ширины W с суммой, кратной M"
    difficulty: [3, 5]
    target_seconds: 2160
  "27.5_median_point":
    title: "Точка на прямой с минимальной суммой расстояний"
    difficulty: [3, 5]
    target_seconds: 2100

templates:
  - id: t27_pair_mod
    subtype: "27.1_pair_distance_mod"
    text: |
      Имеется два файла с числовыми данными: `27A.txt` ({a_size} чисел)
      и `27B.txt` ({b_size} чисел). В первой строке каждого файла
      записано количество чисел, далее — сами числа, по одному в строке.

      Начало файла `27A.txt`:

      ```
      {preview}
      …
      ```

      Рассматриваются пары чисел, стоящих на расстоянии **не менее {k}**
      друг от друга (то есть разность их номеров в файле не меньше {k}),
      сумма которых **делится на {m}**.

      Найдите **максимальную** такую сумму — отдельно для файла A
      и для файла B.

      В ответе запишите два числа {layout_hint}: сначала ответ для
      файла A, затем для файла B.

      На телефоне можно отлаживать метод на файле `27B-mini.txt`
      ({mini_size} чисел) — но ответ считается по полному файлу.

  - id: t27_pair_one_div
    subtype: "27.2_pair_one_divisible"
    text: |
      Имеется два файла: `27A.txt` ({a_size} чисел) и `27B.txt`
      ({b_size} чисел). В первой строке каждого записано количество
      чисел, далее — сами числа.

      Начало файла `27A.txt`:

      ```
      {preview}
      …
      ```

      Рассматриваются пары чисел, стоящих на расстоянии не менее **{k}**
      друг от друга, у которых **хотя бы одно** из двух чисел делится
      на **{m}**.

      Найдите максимальную сумму такой пары — для файла A и для файла B.
      В ответе запишите два числа {layout_hint}.

  - id: t27_count_pairs
    subtype: "27.3_count_pairs"
    text: |
      Имеется два файла: `27A.txt` ({a_size} чисел) и `27B.txt`
      ({b_size} чисел). В первой строке каждого — количество чисел.

      Начало файла `27A.txt`:

      ```
      {preview}
      …
      ```

      Подсчитайте **количество** пар чисел, стоящих на расстоянии
      не менее **{k}** друг от друга, сумма которых делится на **{m}**.

      Ответьте для файла A и для файла B; в ответе запишите два числа
      {layout_hint}.

  - id: t27_window
    subtype: "27.4_window_sum"
    text: |
      Имеется два файла: `27A.txt` ({a_size} чисел) и `27B.txt`
      ({b_size} чисел). В первой строке каждого — количество чисел.

      Начало файла `27A.txt`:

      ```
      {preview}
      …
      ```

      Рассматриваются все группы из **{window} подряд идущих** чисел.
      Найдите **максимальную** сумму такой группы среди тех групп,
      сумма которых **делится на {m}**.

      Ответьте для файла A и для файла B; в ответе запишите два числа
      {layout_hint}.

  - id: t27_median
    subtype: "27.5_median_point"
    text: |
      На прямой расположены объекты, координаты которых записаны
      в файлах `27A.txt` ({a_size} координат) и `27B.txt`
      ({b_size} координат). В первой строке каждого файла — количество
      координат.

      Начало файла `27A.txt`:

      ```
      {preview}
      …
      ```

      Нужно выбрать точку на прямой так, чтобы **суммарное расстояние**
      от неё до всех объектов было минимальным. Точка может совпадать
      с координатой объекта.

      Найдите это минимальное суммарное расстояние — для файла A
      и для файла B. В ответе запишите два числа {layout_hint}.
