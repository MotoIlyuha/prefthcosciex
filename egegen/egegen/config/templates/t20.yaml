# Задание 20 — теория игр. Общий движок с заданиями 19-21;
# различается только спрашиваемый предикат (W1/L1/W2/L2).
task_no: 20
title: "Игра: выигрышная стратегия"

subtypes:
  # плейсхолдеры: {start} {moves} {ending} {target} {count_hint}
  "g1_add_double":
    title: "Одна куча, ходы +1 и ×2"
    difficulty: [1, 4]
    target_seconds: 300
  # плейсхолдеры: {start} {moves} {ending} {target} {count_hint}
  "g2_add_k_times_k":
    title: "Одна куча, ходы +k и ×k"
    difficulty: [2, 5]
    target_seconds: 330
  # плейсхолдеры: {start} {moves} {ending} {target} {count_hint}
  "g3_two_piles":
    title: "Две кучи, окончание по сумме"
    difficulty: [3, 5]
    target_seconds: 400
  # плейсхолдеры: {start} {moves} {ending} {target} {count_hint}
  "g5_three_moves":
    title: "Три возможных хода"
    difficulty: [3, 5]
    target_seconds: 380
  # плейсхолдеры: {start} {moves} {ending} {target} {count_hint}
  "g6_decreasing":
    title: "Убывающая игра: камни убирают"
    difficulty: [2, 5]
    target_seconds: 350

templates:
  - id: t20_g1_add_double
    subtype: "g1_add_double"
    text: |
      Петя и Ваня играют в следующую игру. {start} Игроки ходят
      по очереди, первый ход делает Петя. За один ход игрок может:
      {moves}.

      {ending}

      Известно, что Петя **не может** выиграть за один ход, но при любой
      игре Вани выигрывает своим **вторым** ходом.

      Найдите **{count_hint}** таких значения S. В ответе запишите оба числа
      в порядке возрастания через пробел, в одной строке.

