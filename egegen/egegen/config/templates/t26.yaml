# Задание 26 — сортировка и жадные алгоритмы (2 балла).
task_no: 26
title: "Сортировка и жадные алгоритмы (файл)"

subtypes:
  # плейсхолдеры: {size} {capacity} {unit} {item} {preview}
  "26.1_files_on_disk":
    title: "Файлы на диск: количество и максимальный размер"
    difficulty: [1, 5]
    target_seconds: 2100
  "26.2_boxes":
    title: "Коробки в контейнер"
    difficulty: [1, 5]
    target_seconds: 2100
  "26.3_passengers":
    title: "Группы пассажиров в автобус"
    difficulty: [1, 4]
    target_seconds: 2000
  "26.4_min_removed":
    title: "Количество и наименьшая суммарная масса набора"
    difficulty: [2, 5]
    target_seconds: 2100
  "26.5_two_containers":
    title: "Два контейнера подряд"
    difficulty: [3, 5]
    target_seconds: 2200

templates:
  - id: t26_files
    subtype: "26.1_files_on_disk"
    text: |
      В файле `26.txt` в первой строке записаны два числа: количество
      файлов **{size}** и объём диска **{capacity}** {unit}. В каждой
      из следующих строк — размер одного файла в {unit}.

      Начало файла:

      ```
      {preview}
      …
      ```

      Определите **максимальное количество {item}**, которые можно
      записать на диск, и **наибольший размер файла** среди тех наборов
      такого размера, которые помещаются на диск.

      В ответе запишите два числа через пробел: сначала количество,
      затем наибольший размер.

  - id: t26_boxes
    subtype: "26.2_boxes"
    text: |
      В файле `26.txt` в первой строке записаны количество коробок
      **{size}** и грузоподъёмность контейнера **{capacity}** {unit}.
      Далее — масса каждой коробки в {unit}, по одной в строке.

      Начало файла:

      ```
      {preview}
      …
      ```

      Определите максимальное количество {item}, которые можно погрузить
      в контейнер, и наибольшую массу коробки, которая может оказаться
      в таком наборе.

      В ответе запишите два числа через пробел.

  - id: t26_passengers
    subtype: "26.3_passengers"
    text: |
      В файле `26.txt` в первой строке записаны количество групп
      **{size}** и вместимость автобуса **{capacity}** {unit}.
      Далее — размер каждой группы, по одному числу в строке.
      Группу нельзя разделить: она едет целиком или не едет.

      Начало файла:

      ```
      {preview}
      …
      ```

      Определите максимальное количество {item}, которые можно посадить
      в автобус, и наибольший размер группы, которая может оказаться
      в таком наборе.

      В ответе запишите два числа через пробел.

  - id: t26_min_total
    subtype: "26.4_min_removed"
    text: |
      В файле `26.txt` в первой строке записаны количество деталей
      **{size}** и грузоподъёмность тележки **{capacity}** {unit}.
      Далее — масса каждой детали в {unit}.

      Начало файла:

      ```
      {preview}
      …
      ```

      Определите максимальное количество {item}, которые можно увезти
      за один раз, и **наименьшую возможную суммарную массу** такого
      набора.

      В ответе запишите два числа через пробел.

  - id: t26_two_containers
    subtype: "26.5_two_containers"
    text: |
      В файле `26.txt` в первой строке записаны количество грузов
      **{size}** и грузоподъёмность одного контейнера **{capacity}**
      {unit}. Далее — масса каждого груза.

      Грузы загружают так: сначала первый контейнер наполняют, беря
      самые лёгкие грузы, пока они помещаются; затем **из оставшихся**
      по тому же правилу наполняют второй контейнер.

      Начало файла:

      ```
      {preview}
      …
      ```

      Определите, сколько {item} попадёт в первый контейнер и сколько —
      во второй. В ответе запишите два числа через пробел.
