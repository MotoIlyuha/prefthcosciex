# Задание 6 — исполнитель Черепаха.
task_no: 6
title: "Исполнитель Черепаха, результаты алгоритмов"

subtypes:
  # плейсхолдеры: {program} {boundary}
  "6.1_rectangle_strict":
    title: "Прямоугольник, строго внутри"
    difficulty: [1, 3]
    target_seconds: 240
  "6.2_rectangle_border":
    title: "Прямоугольник, включая границу"
    difficulty: [1, 3]
    target_seconds: 240
  "6.3_intersection":
    title: "Пересечение двух фигур"
    difficulty: [4, 5]
    target_seconds: 330
  "6.4_slanted":
    title: "Наклонные стороны (повороты не на 90°)"
    difficulty: [3, 5]
    target_seconds: 320
  "6.5_lshape":
    title: "Ступенчатая фигура"
    difficulty: [2, 4]
    target_seconds: 300

templates:
  - id: t6_rect_strict
    subtype: "6.1_rectangle_strict"
    text: |
      Исполнитель Черепаха действует на плоскости с декартовой системой
      координат. В начальный момент Черепаха находится в начале координат
      и **направлена вверх**. Команда «Вперёд n» перемещает Черепаху
      на n единиц в направлении движения, команда «Направо m» поворачивает
      её **по часовой стрелке** на m градусов, «Налево m» — против часовой.
      Запись «Повтори k [Команда1 Команда2]» означает, что
      последовательность команд повторится k раз.

      Черепахе был дан для исполнения следующий алгоритм:

      ```
      {program}
      ```

      Определите, сколько точек с целыми координатами будут находиться
      **{boundary}** полученной фигуры.

      В ответе запишите целое число.

  - id: t6_rect_border
    subtype: "6.2_rectangle_border"
    text: |
      Исполнитель Черепаха перемещается по плоскости, оставляя след
      в виде линии. В начальный момент Черепаха находится в начале
      координат и направлена вверх. «Направо m» поворачивает её
      по часовой стрелке.

      Черепахе был дан алгоритм:

      ```
      {program}
      ```

      Сколько точек с целыми координатами будут находиться
      **{boundary}** полученной фигуры?

      В ответе запишите целое число.

  - id: t6_intersection
    subtype: "6.3_intersection"
    text: |
      Исполнитель Черепаха находится в начале координат и направлен
      вверх. Команда «Поднять хвост» отключает след: перемещения
      выполняются, но линия не рисуется; «Опустить хвост» включает
      след обратно.

      Черепахе был дан алгоритм:

      ```
      {program}
      ```

      Получились две фигуры. Определите, сколько точек с целыми
      координатами находятся **{boundary}** **обеих** фигур
      одновременно (то есть в их пересечении).

      В ответе запишите целое число.

  - id: t6_slanted
    subtype: "6.4_slanted"
    text: |
      Исполнитель Черепаха находится в начале координат и направлен
      вверх; «Направо m» поворачивает по часовой стрелке на m градусов.

      Черепахе был дан алгоритм:

      ```
      {program}
      ```

      Стороны получившейся фигуры наклонные, поэтому посчитать точки
      «по клеточкам» не получится — нужен перебор с проверкой
      принадлежности многоугольнику.

      Сколько точек с целыми координатами находятся **{boundary}**
      полученной фигуры? В ответе запишите целое число.

  - id: t6_lshape
    subtype: "6.5_lshape"
    text: |
      Исполнитель Черепаха находится в начале координат и направлен
      вверх. «Направо m» поворачивает по часовой стрелке, «Налево m» —
      против часовой.

      Черепахе был дан алгоритм:

      ```
      {program}
      ```

      Определите, сколько точек с целыми координатами находятся
      **{boundary}** полученной фигуры.

      В ответе запишите целое число.
