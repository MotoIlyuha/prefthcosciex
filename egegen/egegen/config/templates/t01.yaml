# Задание 1 — информационные модели: граф и таблица.
# Методисту: чтобы добавить формулировку, допишите блок в `templates`.
# Доступные плейсхолдеры — в комментарии у каждого подтипа. Неизвестный
# плейсхолдер — ошибка при старте, а не пустое место в условии ученика.
task_no: 1
title: "Информационные модели: граф и таблица"

subtypes:
  # плейсхолдеры: {a} {b}
  "1.1_edge_length":
    title: "Длина конкретной дороги"
    difficulty: [1, 3]
    target_seconds: 180
  # плейсхолдеры: {a} {b} {c} {d}
  "1.2_two_edges":
    title: "Сумма длин двух дорог"
    difficulty: [2, 4]
    target_seconds: 200
  # плейсхолдеры: {a} {b}
  "1.3_shortest_path":
    title: "Кратчайший путь между пунктами"
    difficulty: [3, 5]
    target_seconds: 240
  # плейсхолдеры: {a} {b}  (оба равны букве искомой вершины)
  "1.4_vertex_number":
    title: "Номер строки таблицы для вершины"
    difficulty: [1, 3]
    target_seconds: 160
  # плейсхолдеры: {a} {b}
  "1.5_symmetric":
    title: "Симметричный граф: нужны степени соседей"
    difficulty: [3, 5]
    target_seconds: 220

templates:
  - id: t1_edge_roads
    subtype: "1.1_edge_length"
    text: |
      На схеме изображены дороги между населёнными пунктами. В таблице
      длины дорог указаны в километрах, но названия пунктов в ней заменены
      на П1 … Пn — известно только, что каждому пункту схемы соответствует
      ровно одна строка таблицы.

      Определите длину дороги между пунктами **{a}** и **{b}**.
      В ответе запишите целое число — длину дороги в километрах.

  - id: t1_edge_cables
    subtype: "1.1_edge_length"
    text: |
      Между серверными стойками проложены кабельные трассы. На схеме показано,
      какие стойки соединены, а в таблице указаны длины трасс в метрах —
      но строки и столбцы таблицы обозначены П1 … Пn вместо имён стоек.

      Определите длину трассы между стойками **{a}** и **{b}**.
      В ответе запишите целое число.

  - id: t1_two_edges
    subtype: "1.2_two_edges"
    text: |
      На схеме показаны дороги между посёлками, в таблице — их длины
      в километрах. Соответствие между посёлками схемы и строками таблицы
      не указано.

      Найдите суммарную длину дорог **{a}–{b}** и **{c}–{d}**.
      В ответе запишите целое число.

  - id: t1_shortest
    subtype: "1.3_shortest_path"
    text: |
      На схеме изображены дороги между пунктами, в таблице — их длины
      в километрах. Прямой дороги между **{a}** и **{b}** нет.

      Определите длину кратчайшего пути из **{a}** в **{b}**.
      Проверьте **все** маршруты, а не первый найденный.
      В ответе запишите целое число.

  - id: t1_shortest_delivery
    subtype: "1.3_shortest_path"
    text: |
      Курьер выезжает из пункта **{a}** и должен попасть в пункт **{b}**.
      Схема показывает, какие пункты соединены дорогами, таблица — длины
      дорог в километрах; соответствие строк таблицы пунктам неизвестно.

      Какое наименьшее расстояние придётся проехать курьеру?
      В ответе запишите целое число километров.

  - id: t1_vertex_number
    subtype: "1.4_vertex_number"
    text: |
      На схеме изображены дороги между населёнными пунктами, в таблице —
      их длины. Строки и столбцы таблицы обозначены П1 … Пn.

      Определите, какая строка таблицы соответствует пункту **{a}**.
      В ответе запишите только номер строки — целое число
      (например, для строки П3 ответом будет 3). Обозначение {b} на схеме
      относится к тому же пункту.

  - id: t1_symmetric
    subtype: "1.5_symmetric"
    text: |
      На схеме показаны линии связи между узлами сети, в таблице — их
      протяжённость в метрах. В схеме есть узлы с одинаковой степенью,
      поэтому одних степеней для сопоставления не хватит — смотрите
      степени соседей.

      Определите протяжённость линии между узлами **{a}** и **{b}**.
      В ответе запишите целое число.
