# Задание 14 — позиционные системы счисления.
task_no: 14
title: "Позиционные системы счисления"

subtypes:
  # плейсхолдеры: {expression} {base} {digit}
  "14.1_count_digit":
    title: "Количество цифры в записи выражения"
    difficulty: [1, 5]
    target_seconds: 180
  # плейсхолдеры: {pattern} {base} {divisor}
  "14.2_unknown_digit":
    title: "Неизвестная цифра и делимость"
    difficulty: [2, 5]
    target_seconds: 200
  # плейсхолдеры: {expression} {base} {digit}
  "14.3_digit_sum":
    title: "Сумма цифр записи"
    difficulty: [1, 4]
    target_seconds: 180
  # плейсхолдеры: {expression} {zeros} {base}
  "14.4_min_base":
    title: "Наименьшее основание с нужным окончанием"
    difficulty: [3, 5]
    target_seconds: 220
  # плейсхолдеры: {left} {left_base} {right} {right_base} {base} {digit}
  "14.5_mixed_bases":
    title: "Арифметика с числами в разных системах"
    difficulty: [2, 5]
    target_seconds: 210

templates:
  - id: t14_count
    subtype: "14.1_count_digit"
    text: |
      Значение выражения

      **{expression}**

      записали в системе счисления с основанием **{base}**.

      Сколько цифр **{digit}** содержится в этой записи?
      В ответе запишите целое число.

  - id: t14_count_alt
    subtype: "14.1_count_digit"
    text: |
      Число, равное значению выражения **{expression}**, перевели
      в систему счисления с основанием **{base}**.

      Определите количество цифр **{digit}** в полученной записи.
      В ответе запишите целое число.

  - id: t14_unknown
    subtype: "14.2_unknown_digit"
    text: |
      В записи числа **{pattern}** в системе счисления с основанием
      **{base}** цифра обозначена буквой x. Известно, что это число
      делится на **{divisor}** без остатка.

      Определите цифру x. В ответе запишите её значение в десятичной
      системе счисления (для x ≥ 10 — соответствующее число).

  - id: t14_digit_sum
    subtype: "14.3_digit_sum"
    text: |
      Значение выражения

      **{expression}**

      записали в системе счисления с основанием **{base}**.

      Найдите сумму цифр полученной записи (цифры больше 9 считаются
      своими числовыми значениями). В ответе запишите целое число.

  - id: t14_min_base
    subtype: "14.4_min_base"
    text: |
      Значение выражения **{expression}** записывают в различных
      системах счисления.

      Найдите **наименьшее** основание системы счисления, в которой
      запись этого числа оканчивается на {zeros} нуля (или нулей).
      В ответе запишите целое число — основание.

  - id: t14_mixed
    subtype: "14.5_mixed_bases"
    text: |
      Даны числа **{left}** в системе счисления с основанием
      **{left_base}** и **{right}** в системе счисления с основанием
      **{right_base}**. Их сумму записали в системе счисления
      с основанием **{base}**.

      Сколько цифр **{digit}** содержится в записи суммы?
      В ответе запишите целое число.
