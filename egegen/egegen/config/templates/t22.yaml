# Задание 22 — многопроцессорные системы: параллельные процессы.
task_no: 22
title: "Многопроцессорные системы: параллельные процессы"

subtypes:
  # плейсхолдеры: {preview} {count}
  "22.1_total_time":
    title: "Минимальное общее время (критический путь)"
    difficulty: [1, 4]
    target_seconds: 420
  "22.2_max_parallel":
    title: "Максимум одновременно выполняющихся процессов"
    difficulty: [3, 5]
    target_seconds: 460
  # дополнительно: {moment}
  "22.3_finished_by":
    title: "Сколько процессов завершится к моменту t"
    difficulty: [2, 4]
    target_seconds: 440
  # дополнительно: {target}
  "22.4_earliest_start":
    title: "Когда можно запустить заданный процесс"
    difficulty: [2, 4]
    target_seconds: 420
  # дополнительно: {cpus}
  "22.5_limited_cpus":
    title: "Ограниченное число процессоров"
    difficulty: [4, 5]
    target_seconds: 520

templates:
  - id: t22_total
    subtype: "22.1_total_time"
    text: |
      В файле содержится информация о {count} процессах, выполняющихся
      на многопроцессорной вычислительной системе. Для каждого процесса
      указан идентификатор, время выполнения (в мс) и идентификаторы
      процессов, от которых он зависит. Если процесс B зависит от
      процесса A, то B может начать выполняться только после **полного
      завершения** A. Число процессоров не ограничено, время
      переключения между процессами считается нулевым.

      Начало файла:

      {preview}

      Определите **минимальное** время (в мс), через которое завершится
      выполнение всей совокупности процессов. В ответе запишите целое
      число.

  - id: t22_total_alt
    subtype: "22.1_total_time"
    text: |
      Для вычислительной задачи составлен план из {count} процессов.
      В файле для каждого процесса указаны его идентификатор,
      длительность в миллисекундах и список процессов‑предшественников
      (0 — предшественников нет). Процесс стартует сразу, как только
      завершились **все** его предшественники; процессоров достаточно
      для любого числа одновременных процессов.

      Начало файла:

      {preview}

      Через сколько миллисекунд после старта завершится последний
      процесс? В ответе запишите целое число.

  - id: t22_parallel
    subtype: "22.2_max_parallel"
    text: |
      В файле описаны {count} процессов: идентификатор, время выполнения
      в мс и идентификаторы процессов, от которых зависит данный
      (0 — зависимостей нет). Каждый процесс стартует сразу после
      завершения всех своих зависимостей; число процессоров
      не ограничено.

      Начало файла:

      {preview}

      Определите **максимальное** число процессов, выполняющихся
      одновременно. В ответе запишите целое число.

  - id: t22_finished_by
    subtype: "22.3_finished_by"
    text: |
      В файле описаны {count} процессов: идентификатор, длительность в мс
      и зависимости (0 — зависимостей нет). Процесс стартует сразу после
      завершения всех зависимостей, процессоров достаточно для всех.

      Начало файла:

      {preview}

      Сколько процессов полностью завершится к моменту **{moment} мс**
      после старта системы? В ответе запишите целое число.

  - id: t22_earliest_start
    subtype: "22.4_earliest_start"
    text: |
      В файле описаны {count} процессов: идентификатор, длительность в мс
      и идентификаторы процессов, от которых он зависит.

      Начало файла:

      {preview}

      Через сколько миллисекунд после старта системы можно будет
      запустить процесс с идентификатором **{target}**?
      В ответе запишите целое число.

  - id: t22_limited
    subtype: "22.5_limited_cpus"
    text: |
      В файле описаны {count} процессов: идентификатор, длительность в мс
      и зависимости (0 — зависимостей нет). В системе всего **{cpus}
      процессора**, поэтому одновременно выполняются не более {cpus}
      процессов. Если готовых к запуску процессов больше, чем свободных
      процессоров, первым запускается процесс с **наименьшим
      идентификатором**. Процесс, начавший выполняться, не прерывается.

      Начало файла:

      {preview}

      Определите момент (в мс), к которому завершатся все процессы.
      В ответе запишите целое число.
