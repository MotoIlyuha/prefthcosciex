# Задание 24 — обработка символьной информации (файл).
task_no: 24
title: "Программа обработки символьной информации (длинная строка)"

subtypes:
  # плейсхолдеры: {alphabet} {size} {preview} {char} {k} {pattern}
  "24.1_without_char":
    title: "Максимальная подстрока без заданного символа"
    difficulty: [1, 3]
    target_seconds: 1080
  "24.2_alternating":
    title: "Нет двух одинаковых символов подряд"
    difficulty: [2, 4]
    target_seconds: 1100
  "24.3_window_k":
    title: "Не более k вхождений символа (скользящее окно)"
    difficulty: [3, 5]
    target_seconds: 1140
  "24.4_exact_pattern":
    title: "Повторяющийся шаблон из двух букв"
    difficulty: [3, 5]
    target_seconds: 1120
  "24.5_multiline":
    title: "Файл из многих строк"
    difficulty: [1, 3]
    target_seconds: 1000
  "24.6_no_three_repeat":
    title: "Не более двух одинаковых подряд"
    difficulty: [4, 5]
    target_seconds: 1160

templates:
  - id: t24_without
    subtype: "24.1_without_char"
    text: |
      Текстовый файл `24.txt` состоит из {size} символов латинского
      алфавита {alphabet}.

      Начало файла:

      ```
      {preview}…
      ```

      Определите **максимальную длину** подстроки, не содержащей
      символа **{char}**. Подстрока — это непрерывный фрагмент строки.

      В ответе запишите целое число.

  - id: t24_alternating
    subtype: "24.2_alternating"
    text: |
      Текстовый файл `24.txt` состоит из {size} символов алфавита
      {alphabet}.

      Начало файла:

      ```
      {preview}…
      ```

      Определите максимальную длину подстроки, в которой **никакие два
      соседних символа не совпадают**. Обратите внимание: соседние
      символы должны быть просто **разными**, а не чередоваться по
      какому-то шаблону.

      В ответе запишите целое число.

  - id: t24_window
    subtype: "24.3_window_k"
    text: |
      Текстовый файл `24.txt` состоит из {size} символов алфавита
      {alphabet}.

      Начало файла:

      ```
      {preview}…
      ```

      Определите максимальную длину подстроки, содержащей **не более
      {k}** символов **{char}**.

      В ответе запишите целое число.

  - id: t24_pattern
    subtype: "24.4_exact_pattern"
    text: |
      Текстовый файл `24.txt` состоит из {size} символов алфавита
      {alphabet}.

      Начало файла:

      ```
      {preview}…
      ```

      Определите максимальную длину подстроки, которая представляет
      собой повторение фрагмента **{pattern}** один или несколько раз
      подряд (то есть {pattern}, {pattern}{pattern}, {pattern}{pattern}{pattern}
      и так далее).

      В ответе запишите целое число.

  - id: t24_multiline
    subtype: "24.5_multiline"
    text: |
      Текстовый файл `24.txt` содержит {size} строк, состоящих
      из символов алфавита {alphabet}.

      Начало первой строки:

      ```
      {preview}…
      ```

      Определите **наибольшее количество** символов **{char}**
      в одной строке файла.

      В ответе запишите целое число.

  - id: t24_two_repeat
    subtype: "24.6_no_three_repeat"
    text: |
      Текстовый файл `24.txt` состоит из {size} символов алфавита
      {alphabet}.

      Начало файла:

      ```
      {preview}…
      ```

      Определите максимальную длину подстроки, в которой **никакой
      символ не встречается три раза подряд** (два одинаковых подряд —
      можно, три — уже нет).

      В ответе запишите целое число.
