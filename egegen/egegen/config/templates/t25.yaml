# Задание 25 — обработка целочисленной информации (делители, маски).
task_no: 25
title: "Программа обработки целочисленной информации (делители, маски)"

subtypes:
  # плейсхолдеры: {lo} {hi} {k}
  "25.1_divisor_count":
    title: "Числа с заданным количеством делителей"
    difficulty: [1, 4]
    target_seconds: 1200
  # плейсхолдеры: {multiplier} {mask}
  "25.2_mask_multiple":
    title: "Маска и кратность"
    difficulty: [2, 5]
    target_seconds: 1260
  "25.3_largest_proper":
    title: "Наибольший делитель, отличный от самого числа"
    difficulty: [2, 4]
    target_seconds: 1200
  "25.4_divisor_sum":
    title: "Сумма делителей"
    difficulty: [3, 5]
    target_seconds: 1240
  "25.5_count_only":
    title: "Количество подходящих чисел"
    difficulty: [1, 3]
    target_seconds: 1100

templates:
  - id: t25_divisor_count
    subtype: "25.1_divisor_count"
    text: |
      Рассмотрим натуральные числа в диапазоне от **{lo}** до **{hi}**
      включительно, у которых **ровно {k} различных натуральных
      делителя** (считая 1 и само число).

      Выведите все такие числа в порядке возрастания, а для каждого —
      его **второй по величине** делитель (то есть наибольший делитель,
      отличный от самого числа).

      В ответе запишите пары через запятую: «число делитель, число
      делитель, …».

  - id: t25_mask
    subtype: "25.2_mask_multiple"
    text: |
      Найдите все натуральные числа, не превышающие 10 000 000, которые
      **кратны {multiplier}** и запись которых в десятичной системе
      счисления соответствует маске **{mask}**.

      В маске символ `?` означает ровно одну произвольную цифру,
      а символ `*` — любую последовательность цифр, в том числе пустую.

      Выведите числа в порядке возрастания, а для каждого — его частное
      от деления на {multiplier}. В ответе запишите пары через запятую.

  - id: t25_largest_proper
    subtype: "25.3_largest_proper"
    text: |
      Рассмотрим натуральные числа от **{lo}** до **{hi}**
      включительно, у которых ровно **{k}** различных натуральных
      делителей.

      Для каждого такого числа выведите само число и его **наибольший
      делитель, отличный от самого числа**, в порядке возрастания чисел.

      В ответе запишите пары через запятую.

  - id: t25_divisor_sum
    subtype: "25.4_divisor_sum"
    text: |
      Рассмотрим натуральные числа от **{lo}** до **{hi}**
      включительно, у которых ровно **{k}** различных натуральных
      делителей.

      Для каждого такого числа выведите само число и **сумму всех его
      делителей** (включая 1 и само число), в порядке возрастания чисел.

      В ответе запишите пары через запятую.

  - id: t25_count
    subtype: "25.5_count_only"
    text: |
      Сколько существует натуральных чисел в диапазоне от **{lo}**
      до **{hi}** включительно, у которых ровно **{k}** различных
      натуральных делителей (считая 1 и само число)?

      В ответе запишите одно целое число.
