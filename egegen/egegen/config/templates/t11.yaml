# Задание 11 — информационный объём сообщения.
task_no: 11
title: "Информационный объём сообщения (пароли, идентификаторы)"

subtypes:
  # плейсхолдеры: {alphabet} {alphabet_ru} {length} {users} {extra} {unit}
  "11.1_volume":
    title: "Объём памяти под N паролей"
    difficulty: [1, 4]
    target_seconds: 180
  # дополнительно: {total_bytes}
  "11.2_find_param":
    title: "По объёму найти длину пароля"
    difficulty: [2, 5]
    target_seconds: 220
  "11.3_extra_fields":
    title: "С дополнительными сведениями на запись"
    difficulty: [3, 5]
    target_seconds: 220
  # дополнительно: {budget_bytes}
  "11.4_max_symbols":
    title: "Максимальная длина при ограничении памяти"
    difficulty: [3, 5]
    target_seconds: 230
  # дополнительно: {alphabet2} {alphabet2_ru} {length2}
  "11.5_two_alphabets":
    title: "Два алфавита в одном идентификаторе"
    difficulty: [3, 5]
    target_seconds: 250

templates:
  - id: t11_volume
    subtype: "11.1_volume"
    text: |
      При регистрации в информационной системе каждому пользователю
      выдаётся пароль из {length} символов. В качестве символов
      используют {alphabet_ru} — всего {alphabet} различных символов.
      Каждый символ кодируется одинаковым и минимально возможным
      количеством бит, а каждый пароль — минимально возможным и одинаковым
      целым числом байт.

      Определите объём памяти, необходимый для хранения {users} паролей.
      В ответе запишите целое число — объём в {unit}.

  - id: t11_volume_badges
    subtype: "11.1_volume"
    text: |
      Для {users} участников конференции печатают бейджи с кодом из
      {length} символов. Код составляется из {alphabet_ru}
      ({alphabet} различных символов); каждый символ кодируется
      минимально возможным одинаковым числом бит, каждый код —
      целым числом байт.

      Сколько {unit} памяти нужно для хранения всех кодов?
      В ответе запишите целое число.

  - id: t11_find_length
    subtype: "11.2_find_param"
    text: |
      В информационной системе пароли составляются из {alphabet_ru}
      ({alphabet} различных символов). Каждый символ кодируется
      минимально возможным одинаковым числом бит, каждый пароль —
      целым числом байт.

      Для хранения {users} паролей потребовалось {total_bytes} байт.
      Определите длину пароля в символах. В ответе запишите целое число.

  - id: t11_extra
    subtype: "11.3_extra_fields"
    text: |
      В системе на каждого пользователя хранится пароль из {length}
      символов и дополнительные сведения, занимающие ровно {extra} байт.
      Пароль составляется из {alphabet_ru} ({alphabet} различных
      символов); символ кодируется минимально возможным одинаковым числом
      бит, пароль — целым числом байт.

      Сколько {unit} нужно для хранения данных о {users} пользователях?
      В ответе запишите целое число.

  - id: t11_max_length
    subtype: "11.4_max_symbols"
    text: |
      Под хранение записей о {users} пользователях выделено
      {budget_bytes} байт. На каждого пользователя хранится пароль
      и {extra} байт дополнительных сведений. Пароль составляется
      из {alphabet_ru} ({alphabet} различных символов); символ
      кодируется минимально возможным одинаковым числом бит,
      а каждая запись — целым числом байт.

      Какова максимально возможная длина пароля в символах?
      В ответе запишите целое число.

  - id: t11_two_alphabets
    subtype: "11.5_two_alphabets"
    text: |
      Идентификатор состоит из двух частей: сначала {length} символов
      из набора {alphabet_ru} ({alphabet} различных символов), затем
      {length2} символов из набора {alphabet2_ru} ({alphabet2}
      различных символов). Символы каждой части кодируются минимально
      возможным одинаковым числом бит (для каждой части — своим),
      а весь идентификатор занимает целое число байт; к нему добавляется
      {extra} байт служебных данных.

      Сколько {unit} нужно для хранения {users} идентификаторов?
      В ответе запишите целое число.
