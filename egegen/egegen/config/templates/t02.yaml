# Задание 2 — таблицы истинности, порядок столбцов.
task_no: 2
title: "Таблицы истинности, логические функции"

subtypes:
  # плейсхолдеры: {formula} {table} {variables} {n}
  "2.1_full_rows":
    title: "Четыре переменные, строки заполнены полностью"
    difficulty: [1, 3]
    target_seconds: 180
  "2.2_blank_cells":
    title: "С пустыми ячейками"
    difficulty: [2, 5]
    target_seconds: 200
  "2.3_three_vars":
    title: "Три переменные"
    difficulty: [1, 3]
    target_seconds: 160
  "2.4_value_one":
    title: "Строки, где F = 1"
    difficulty: [2, 4]
    target_seconds: 190
  "2.5_mixed_values":
    title: "Смешанные значения F"
    difficulty: [3, 5]
    target_seconds: 220

templates:
  - id: t2_classic
    subtype: "2.1_full_rows"
    text: |
      Логическая функция F задаётся выражением

      **{formula}**

      Ниже приведён фрагмент таблицы истинности функции F, в котором
      столбцы, соответствующие переменным, идут в неизвестном порядке.

      {table}

      Определите, какому столбцу таблицы соответствует каждая из переменных
      {variables}. В ответе напишите буквы {variables} в том порядке,
      в котором идут соответствующие им столбцы (сначала — буква,
      соответствующая первому столбцу). Буквы пишите подряд, без пробелов
      и разделителей.

  - id: t2_blanks
    subtype: "2.2_blank_cells"
    text: |
      Логическая функция F задаётся выражением

      **{formula}**

      Дан фрагмент таблицы истинности функции F. Часть ячеек не заполнена —
      в них может стоять любое значение.

      {table}

      Определите, какому столбцу соответствует каждая из переменных
      {variables}. В ответе напишите {n} буквы подряд, без разделителей,
      в порядке следования столбцов.

  - id: t2_three
    subtype: "2.3_three_vars"
    text: |
      Логическая функция F задаётся выражением

      **{formula}**

      Дан фрагмент таблицы истинности функции F, столбцы переменных идут
      в произвольном порядке.

      {table}

      Определите, какому столбцу соответствует каждая из переменных
      {variables}. В ответе напишите {n} буквы подряд, без разделителей.

  - id: t2_ones
    subtype: "2.4_value_one"
    text: |
      Логическая функция F задаётся выражением

      **{formula}**

      В таблице приведены **только те** наборы значений переменных,
      при которых функция F истинна. Столбцы переменных идут в неизвестном
      порядке.

      {table}

      Определите, какому столбцу соответствует каждая из переменных
      {variables}. В ответе напишите буквы подряд, без разделителей.

  - id: t2_mixed
    subtype: "2.5_mixed_values"
    text: |
      Логическая функция F задаётся выражением

      **{formula}**

      Дан фрагмент таблицы истинности: в разных строках функция принимает
      разные значения, а столбцы переменных перепутаны.

      {table}

      Определите, какому столбцу соответствует каждая из переменных
      {variables}. Напишите буквы подряд, без разделителей, в порядке
      следования столбцов.
