name: bayt

x-env: &env
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    <<: *env
    restart: unless-stopped
    networks: [default, sandbox]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    <<: *env
    restart: unless-stopped
    networks: [default, sandbox]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    <<: *env
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}

  runner:
    build:
      context: ./runner
    <<: *env
    restart: unless-stopped
    # Only the internal network: no route to the internet at all, besides the
    # jail's own empty network namespace for student code.
    networks: [sandbox]
    # No outbound network for user code: the jail drops the net namespace, and
    # the service itself only needs to be reachable from api/worker.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN   # required by nsjail to create user/mount namespaces
    tmpfs:
      - /sandbox:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: /api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, client]
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      SITE_ADDRESS: ":80"

networks:
  default: {}
  sandbox:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
